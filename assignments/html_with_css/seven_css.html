<!DOCTYPE html>
<html>
<head>
  <title>Hire Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dfe9f3, #ffffff);
      margin: 0;
      padding: 0;
    }

    .container {
      width: 400px;
      margin: 60px auto;
      background: #ffffff;
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      color: #555;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #4a90e2;
      outline: none;
      box-shadow: 0 0 5px rgba(74,144,226,0.4);
    }

    textarea {
      resize: none;
      height: 80px;
    }

    input[type="submit"] {
      background: #4a90e2;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    input[type="submit"]:hover {
      background: #357abd;
    }

    hr {
      margin-top: 30px;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
    }

    .footer a {
      text-decoration: none;
      color: #4a90e2;
      font-weight: bold;
      transition: 0.3s;
    }

    .footer a:hover {
      color: #2c5d9f;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>HTML Form</h2>

    <form>
      <label>First name:</label>
      <input type="text" name="fname" placeholder="First Name">

      <label>Last name:</label>
      <input type="text" name="lname" placeholder="Last Name">

      <label>Courses:</label>
      <select name="course">
        <option value="">--Please choose an option--</option>
        <option value="OS">OS</option>
        <option value="ESD">ESD</option>
        <option value="Research">Research</option>
        <option value="Java">Java</option>
      </select>

      <label>USN:</label>
      <input type="text" name="usn" placeholder="USN">

      <label>Feedback:</label>
      <textarea name="feedback" placeholder="Enter your feedback"></textarea>

      <input type="submit" value="Submit">
    </form>

    <hr>

    <div class="footer">
      <a href="https://nayanam09.github.io/sem-fet/" target="_blank">Home page</a>
    </div>
  </div>

</body>
</html>
